<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusPals</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="pomodoro">
<div class="app">
<header>
  <div class="brand"><div class="logo">🐾</div><div><h1>FocusPals</h1><p id="greet">Let's grow together!</p></div></div>
  <span class="tip"><kbd>Space</kbd> start/pause · <kbd>R</kbd> reset · <kbd>F</kbd> fullscreen</span>
</header>
<div class="grid">
<section class="card timer" id="timerCard">
  <div class="stage"><div class="pet" id="pet">🐱</div><div class="bubble" id="bubble">Ready when you are!</div></div>
  <div class="tabs">
    <button class="tab on" data-mode="pomodoro">🎯 Focus</button>
    <button class="tab" data-mode="shortBreak">🍓 Snack</button>
    <button class="tab" data-mode="longBreak">🛏️ Nap</button>
  </div>
  <div class="dial">
    <svg viewBox="0 0 300 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--a2)"/></linearGradient></defs>
      <circle class="trk" cx="150" cy="150" r="138"/><circle class="fill" id="ring" cx="150" cy="150" r="138"/></svg>
    <div class="mid">
      <span class="lbl" id="lbl"></span><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
      <div class="time" id="time">25:00</div>
      <button class="pill" id="pill" title="Rename quest">✏️ <span id="pillText"></span></button>
    </div>
  </div>
  <div class="acts">
    <button class="btn" id="reset" title="Reset (R)">↺</button>
    <button class="btn go" id="go"></button>
    <button class="btn" id="plus" title="Add 5 minutes">+5m</button>
  </div>
  <div class="tray">
    <div class="amb"><button class="tb" id="rain">🌧️ Rain sounds</button><input type="range" id="vol" min="0" max="100" value="45" aria-label="Volume"></div>
    <button class="tb" id="fs">⛶ Focus mode</button>
  </div>
</section>
<aside>
  <div class="card">
    <div class="row"><div><div class="meta" id="lvlTitle"></div><div class="big" id="lvl">Lv 1</div></div><div><div class="pct" id="xpTxt">0 XP</div><div class="sub" id="today">Today: 0h 00m</div></div></div>
    <div class="bar"><b id="barFill"></b></div>
    <div class="row"><span class="meta">Pick your buddy</span><div class="picker" id="picker"></div></div>
  </div>
  <div class="card">
    <div class="row"><h3>🗺️ Quests</h3><span class="chip" id="cnt">0 of 0 done</span></div>
    <form id="tf"><input id="ti" placeholder="Add a quest, e.g. Finish chapter 2" autocomplete="off" required><button class="add" title="Add quest">+</button></form>
    <ul id="tl"></ul>
  </div>
  <div class="card">
    <h3>🏆 Trophies</h3><div class="trophies" id="trophies"></div>
  </div>
  <div class="card hist">
    <div class="row"><h3>📖 Adventure log</h3><button class="clr" id="clr">Clear</button></div>
    <div class="hl" id="hl"></div>
  </div>
</aside>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
